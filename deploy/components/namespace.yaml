apiVersion: v1
kind: Namespace
metadata:
  name: metabare
  labels:
    app.kubernetes.io/part-of: metabare
    # Enforce the restricted Pod Security Standard. Every workload here runs
    # unprivileged, non-root, with no capabilities, so this costs nothing and
    # turns "we intended to" into "the API server checks".
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
