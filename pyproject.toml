[project]
name = "metabare"
version = "0.2.0.dev0"
description = "Cost-aware, scale-to-zero multimodal retrieval on EKS with Firn and S3"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"

# Shared runtime. Every service installs this package; the per-service
# Dockerfiles select an optional-dependency group so the API image does not
# carry the worker's dependencies and vice versa.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
storage = [
    "boto3>=1.35",
]
encoder = [
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "numpy>=2.1",
    "huggingface-hub>=0.26",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "boto3-stubs[s3,sqs]>=1.35",
    "moto[s3,sqs]>=5.0",
    "respx>=0.22",
]

[project.scripts]
metabare-api = "metabare.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metabare"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "S",    # flake8-bandit, this is a public reference project
    "BLE",  # no bare except; do not swallow exceptions
    "C4",   # comprehensions
    "DTZ",  # flake8-datetimez, no naive UTC mistakes in ingestion timestamps
    "T20",  # no print(), structured logging only
    "SIM",  # simplify
    "PTH",  # use pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest asserts; hardcoded local test credentials are the point.
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["T20"]
"benchmarks/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tokenizers.*", "onnxruntime.*", "huggingface_hub.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A hang is a failure, not a wait. This suite has twice stalled in an
# environment other than the author's, both times on a thread boundary, and a
# stalled run gives you nothing to debug. With a timeout you get a traceback
# pointing at the exact line instead.
timeout = 60
timeout_method = "thread"
addopts = "-q --strict-markers"
markers = [
    "integration: requires the local docker compose harness (MinIO + Firn)",
    "slow: takes more than a few seconds",
]
