name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.21"

jobs:
  python:
    name: Python lint, types, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-extras --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # -m "not integration" so a missing local stack is a skip, not a failure.
      # The integration path is covered by the compose job below.
      - name: Unit tests
        run: uv run pytest tests/ -m "not integration" --cov=metabare --cov-report=term-missing

  shell:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: '**/*.md'

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check for Terraform
        id: check
        run: |
          if [ -d infra ] && find infra -name '*.tf' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform yet, skipping."
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.present == 'true'
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: terraform fmt
        if: steps.check.outputs.present == 'true'
        run: terraform fmt -check -recursive infra/

      # init -backend=false so validation needs no AWS credentials and no
      # remote state. This runs on pull requests from forks.
      - name: terraform validate
        if: steps.check.outputs.present == 'true'
        run: |
          for dir in $(find infra -name '*.tf' -exec dirname {} \; | sort -u); do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@v6
        if: steps.check.outputs.present == 'true'
        with:
          tflint_version: latest

      - name: tflint
        if: steps.check.outputs.present == 'true'
        run: tflint --recursive --minimum-failure-severity=warning

  cost-guardrails:
    name: Cost guardrails
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Guards against accidental broad instance-family expansion and
      # unlimited NodePools. Cheap to check, and the failure mode is a
      # surprise bill rather than a bug.
      - name: Check Karpenter NodePools declare limits
        run: ./scripts/check-cost-guardrails.sh

  build:
    name: Container build and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          load: true
          tags: metabare-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: metabare-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  integration:
    name: End-to-end on the compose stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The real end-to-end proof: MinIO, Firn and the API, then ingest a note
      # and search for it. This is what catches an integration regression that
      # unit tests with doubles cannot, such as a namespace that has rows but
      # no full-text index.
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Smoke test
        run: ./scripts/smoke.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
