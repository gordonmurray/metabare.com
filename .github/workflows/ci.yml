name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts."
            exit 0
          fi
          shellcheck "${files[@]}"

  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: fmt
        run: terraform fmt -check -recursive infra
      # -backend=false, so validation needs no AWS credentials or state.
      - name: validate
        run: |
          for dir in infra/bootstrap infra/site; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: tflint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Child modules do not inherit this directory's .tflint.hcl, so the
          # path is passed explicitly.
          tflint --init --config "$(pwd)/.tflint.hcl"
          tflint --recursive --config "$(pwd)/.tflint.hcl" --minimum-failure-severity=warning

  spike-python:
    name: Spike scripts (Ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Ruff
        working-directory: spike
        run: |
          uvx ruff@0.16.10 check scripts
          uvx ruff@0.16.10 format --check scripts

  spike:
    name: Browser inference spike (${{ matrix.browser }}, WASM)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: spike
    env:
      # onnxruntime-node, a Node-only dependency of Transformers.js that the
      # browser never uses, otherwise downloads CUDA binaries from NuGet at
      # install time.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spike/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Only the precisions this job runs: CLIP at q4f16, MiniLM at q8.
      - uses: actions/cache@v6
        with:
          path: models/files
          key: models-${{ hashFiles('models/models.lock.json') }}-q4f16-q8

      - name: Fetch and verify models
        run: ../models/fetch.sh '_model_q4f16|^onnx/model_quantized|json$'

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # A CI runner has no GPU, so this covers the WASM path in each engine.
      # WebGPU results come from real devices.
      - name: Run the spike page
        env:
          SPIKE_LABEL: ci
          SPIKE_BROWSER: ${{ matrix.browser }}
          SPIKE_RUNS: wasm:q4f16:q8
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-ci-${{ matrix.browser }}
          path: spike/results/ci/

  web:
    name: Web app (types, lint, unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint .
      - name: Prettier
        run: npx prettier --check .
      - name: Unit tests
        run: npx vitest run

  web-e2e:
    name: Web app in ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: web
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: models/files
          key: models-${{ hashFiles('models/models.lock.json') }}-q4f16-q8
      - name: Fetch and verify models
        run: ../models/fetch.sh '_model_q4f16|^onnx/model_quantized|json$'
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Ingestion tests
        env:
          APP_BROWSERS: ${{ matrix.browser }}
        run: npx playwright test ingest
      # The first-visit memory budget, five cold runs. It reads /proc, so it
      # runs on Linux, for the two browsers it was set for.
      - name: Memory budget
        if: matrix.browser != 'webkit'
        env:
          APP_BROWSERS: ${{ matrix.browser }}
          MEMORY_RUNS: 5
        run: npx playwright test memory
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-e2e-${{ matrix.browser }}
          path: web/test-results/
