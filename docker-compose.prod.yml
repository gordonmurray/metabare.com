# Production compose for the EC2 deployment. No MinIO, no published
# 8080/8081 ports. App credentials come from /opt/metabare/.env via
# --env-file (rendered at boot from Secrets Manager by user-data).

services:
  firn:
    image: ghcr.io/gordonmurray/firnflow:0.3.0
    container_name: metabare-firn
    environment:
      FIRNFLOW_S3_ENDPOINT: "https://s3.${S3_REGION}.amazonaws.com"
      FIRNFLOW_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      FIRNFLOW_S3_SECRET_KEY: ${S3_SECRET_KEY}
      FIRNFLOW_S3_BUCKET: ${S3_BUCKET}
      FIRNFLOW_BIND: "0.0.0.0:3000"
      RUST_LOG: info
    restart: unless-stopped

  upload:
    build: ./apps/upload
    container_name: metabare-upload
    depends_on:
      - firn
    environment:
      R2_ENDPOINT: "https://s3.${S3_REGION}.amazonaws.com"
      R2_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      R2_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      R2_BUCKET: ${S3_BUCKET}
      FIRN_URL: http://firn:3000
      FIRN_NAMESPACE: ${FIRN_NAMESPACE}
    volumes:
      - upload-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://localhost:8080/health').read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  search:
    build: ./apps/search
    container_name: metabare-search
    depends_on:
      - firn
    environment:
      R2_ENDPOINT: "https://s3.${S3_REGION}.amazonaws.com"
      R2_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      R2_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      R2_BUCKET: ${S3_BUCKET}
      R2_REGION: ${S3_REGION}
      FIRN_URL: http://firn:3000
      FIRN_NAMESPACE: ${FIRN_NAMESPACE}
      SEARCH_BACKEND: ${SEARCH_BACKEND}
      BASE_IMAGE_URL: ${BASE_IMAGE_URL}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://localhost:8080/health').read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  frontend:
    build: ./apps/frontend
    container_name: metabare-frontend
    depends_on:
      upload:
        condition: service_healthy
      search:
        condition: service_healthy
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  upload-storage:
