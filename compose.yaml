# Local development harness. Costs nothing and needs no AWS account.
#
#   docker compose up -d --build
#   make smoke
#   docker compose down -v
#
# The seam is the object-storage API: MinIO stands in for S3, and everything
# above it is the same code that runs on EKS. What is deliberately *not*
# modelled here is anything whose behaviour only exists in AWS: IAM, Pod
# Identity, SQS delivery semantics, and Karpenter. Those are proven on EKS,
# not simulated locally.

name: metabare

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      # Local-only defaults. Nothing in any deployed environment uses static
      # keys; on EKS credentials come from Pod Identity.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/metabare-dev
    restart: "no"

  firn:
    image: ghcr.io/gordonmurray/firnflow:0.9.4
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      FIRNFLOW_STORAGE_URI: s3://metabare-dev/firn
      FIRNFLOW_S3_ENDPOINT: http://minio:9000
      FIRNFLOW_S3_REGION: eu-west-1
      FIRNFLOW_S3_ACCESS_KEY: minioadmin
      FIRNFLOW_S3_SECRET_KEY: minioadmin
      FIRNFLOW_BIND: "0.0.0.0:3000"
      # The object cache is the layer that makes a novel query over
      # already-read data avoid repeating object-storage GETs. Enabled here so
      # local behaviour matches the deployed configuration rather than
      # accidentally testing a different caching model.
      FIRNFLOW_OBJECT_CACHE_ENABLED: "true"
      FIRNFLOW_OBJECT_CACHE_DIR: /var/cache/firn
      RUST_LOG: info
    ports:
      - "3000:3000"
    volumes:
      - firn-cache:/var/cache/firn
    healthcheck:
      # The Firn image ships no curl or wget, so the probe uses bash's
      # /dev/tcp to speak HTTP directly. This is a genuine /health check
      # rather than a bare TCP connect. Kubernetes is unaffected: an httpGet
      # probe is performed by the kubelet and needs nothing in the image.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      minio-init:
        condition: service_completed_successfully
      firn:
        condition: service_healthy
    environment:
      METABARE_ENVIRONMENT: local
      METABARE_LOG_FORMAT: console
      METABARE_BUCKET: metabare-dev
      METABARE_REGION: eu-west-1
      METABARE_S3_ENDPOINT_URL: http://minio:9000
      METABARE_S3_ACCESS_KEY_ID: minioadmin
      METABARE_S3_SECRET_ACCESS_KEY: minioadmin
      FIRN_URL: http://firn:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8080/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # The embedding model is baked into the image, so this is an ONNX
      # session load rather than a download.
      start_period: 30s

volumes:
  minio-data:
  firn-cache:
