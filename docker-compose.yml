# Local harness for the Metabare + Firn migration (P1 step 1).
#
# Brings up MinIO plus Firn only. Metabare's own services are added in step 2.
# Firn is pulled from its published GHCR image so this setup exercises the
# same artefact a third-party adopter would consume.
#
# Bring up:   docker compose up -d
# Smoke test: ./scripts/smoke-firn.sh
# Tear down:  docker compose down -v

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: metabare-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/metabare
      "

  firn:
    image: ghcr.io/gordonmurray/firnflow:0.3.0
    container_name: metabare-firn
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      FIRNFLOW_S3_ENDPOINT: http://minio:9000
      FIRNFLOW_S3_ACCESS_KEY: minioadmin
      FIRNFLOW_S3_SECRET_KEY: minioadmin
      FIRNFLOW_S3_BUCKET: metabare
      FIRNFLOW_BIND: "0.0.0.0:3000"
      RUST_LOG: info
    ports:
      - "3000:3000"

  upload:
    build: ./apps/upload
    container_name: metabare-upload
    depends_on:
      minio-init:
        condition: service_completed_successfully
      firn:
        condition: service_started
    environment:
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: metabare
      FIRN_URL: http://firn:3000
      FIRN_NAMESPACE: images
    volumes:
      - upload-storage:/app/storage
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://localhost:8080/health').read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  search:
    build: ./apps/search
    container_name: metabare-search
    depends_on:
      minio-init:
        condition: service_completed_successfully
      firn:
        condition: service_started
    environment:
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: metabare
      FIRN_URL: http://firn:3000
      FIRN_NAMESPACE: images
      SEARCH_BACKEND: firn
      BASE_IMAGE_URL: "http://localhost:9000/metabare/"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://localhost:8080/health').read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  frontend:
    build: ./apps/frontend
    container_name: metabare-frontend
    depends_on:
      upload:
        condition: service_healthy
      search:
        condition: service_healthy
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  minio-data:
  upload-storage:
