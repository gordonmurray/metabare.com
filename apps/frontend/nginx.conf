server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ALB forwards X-Forwarded-Proto. Only redirect when ALB tells us
  # the original request was http; locally the header is empty.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  location = /health {
    access_log off;
    return 200 'healthy\n';
  }

  # Backend API proxies. Same-origin so app.js can use relative paths.
  location /search {
    proxy_pass http://search:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  location /latest {
    proxy_pass http://search:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  location /upload {
    proxy_pass http://upload:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 25m;
  }
  location /storage {
    proxy_pass http://upload:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Firn's own Prometheus text endpoint, proxied read-only.
  location /metrics {
    proxy_pass http://firn:3000/metrics;
    proxy_set_header Host $host;
  }

  # Grafana (anonymous viewer), provisioned with the Firn dashboard.
  # `^~` beats the regex location below so that Grafana's .js/.css
  # assets under /grafana/public/... reach Grafana instead of being
  # swallowed by the static-cache block and 404'd by nginx's root.
  # No trailing slash on proxy_pass: Grafana runs with
  # serve_from_sub_path=true and needs the /grafana/ prefix
  # preserved in the upstream request.
  location ^~ /grafana/ {
    proxy_pass http://grafana:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Static asset caching.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|json)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
